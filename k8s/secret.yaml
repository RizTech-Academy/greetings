# A Secret holds sensitive values (API keys, passwords). It looks like a
# ConfigMap, but is meant for secrets — values are base64-encoded (NOT
# encrypted by default) and are treated specially by tooling and access control.
# In real projects you do NOT commit real secrets to Git; you create them from a
# secrets manager or `kubectl create secret`. This file shows the shape only.
apiVersion: v1
kind: Secret
metadata:
  name: greetings-secret
type: Opaque
stringData: # stringData lets you write plain values; Kubernetes encodes them
  API_KEY: "replace-me-in-a-real-secrets-manager"
